name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: wincrm_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d wincrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create synthetic Supabase roles
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d wincrm_test <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
          end
          $$;
          SQL

      - name: Apply complete migration chain
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            docker exec -i "$POSTGRES_CONTAINER_ID" \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d wincrm_test \
              < "$migration"
          done

      - name: Prove durable SMS claim concurrency
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash test/postgres/ghlSmsOutboundClaimConcurrency.sh

      - name: Prove controlled-live authorization concurrency
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash test/postgres/ghlSmsControlledLiveAuthorizationConcurrency.sh

      - name: Prove reconciliation dry-run lock concurrency
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash test/postgres/contactReconciliationDryRunConcurrency.sh
